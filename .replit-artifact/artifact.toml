kind = "web"
previewPath = "/"
title = "Capital Hills Developments"
description = "A fast, mobile-first real estate company website for Capital Hills Developments, with a conversion-focused homepage, searchable projects, dedicated project details, contact tools, offers, reviews, news, and simple property utilities."
version = "1.0.0"
id = "artifacts/capital-hills-developments"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23626

[services.development]
run = "pnpm --filter @workspace/capital-hills-developments run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/capital-hills-developments", "run", "build" ]
serve = "static"
publicDir = "artifacts/capital-hills-developments/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23626"
BASE_PATH = "/"
